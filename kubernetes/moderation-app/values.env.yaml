# ============================================================================
# values.env.yaml — variables d'environnement des 4 services
#
# Utilisation :
#   helm install <name> . -f values.yaml -f values.env.yaml
#
#   .config -> injecte dans le ConfigMap  configmap-<service>-<namespace>
#   .secret -> injecte dans le Secret     secrete-<service>-<namespace>
#   (les Deployments les chargent via envFrom: configMapRef + secretRef)
# ============================================================================

env:

  # ==========================================================================
  # ingestion — services/ingestion_service/src/config/settings.ts
  # ==========================================================================
  ingestion:
    config:
      HTTP_PORT: "3000"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CONTENT_QUEUE_NAME: contentQueue
      THROTTLE_CAPACITY: "200"
      THROTTLE_COST_PER_TOKEN: "1"
      THROTTLE_REFILL_INTERVAL_MS: "60000"
      BACKLOG_MAX_POSTS_PER_COMMUNITY: "1000"
      BACKLOG_TTL_SECONDS: "3600"
      CONFIG_CACHE_TTL_SECONDS: "300"
      MAX_ITEMS_PER_BATCH: "1000"
      QUEUE_ATTEMPTS: "1"
      QUEUE_BACKOFF_MS: "1000"
      LOG_FORMAT: console
    secret:
      # !!! renseigner avant deployment !!!
      REDIS_PASSWORD: ""
      API_KEY_HMAC_SECRET: ""
      DATABASE_URL: ""

  # ==========================================================================
  # moderation — moderation_service/app/config/settings.py
  # ==========================================================================
  moderation:
    config:
      # Redis / BullMQ
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CONTENT_QUEUE_NAME: contentQueue
      DECISION_QUEUE_NAME: decisionQueue
      # HTTP
      HTTP_PORT: "8000"
      # WorkerPool (auto-scaling asyncio)
      WORKER_POOL_MIN: "2"
      WORKER_POOL_INITIAL: "4"
      WORKER_POOL_MAX: "32"
      SCALE_STEP: "2"
      SCALE_COOLDOWN_SEC: "10"
      MONITOR_INTERVAL_SEC: "5"
      CPU_LOW_PCT: "65"
      CPU_HIGH_PCT: "85"
      RAM_LOW_PCT: "70"
      RAM_HIGH_PCT: "80"
      RAM_CRITICAL_PCT: "90"
      # Retry selectif
      MAX_FILTER_RETRIES: "3"
      RETRY_BASE_DELAY_MS: "5000"
      RETRY_MAX_DELAY_MS: "300000"
      # Lot / filtres
      MAX_ITEMS_PER_BATCH: "50"
      FILTER_TIMEOUT_SEC: "10"
      FILTERS_DISABLED: ""
      # AI Gateway (URL + parametres, la cle est dans secret)
      AI_GATEWAY_URL: http://localhost:4000
      AI_REQUEST_TIMEOUT_SEC: "30"
      AI_MAX_PARALLEL_REQUESTS: "4"
      AI_TEXT_BATCH_SIZE: "10"
      AI_TEXT_MAX_CHARS_PER_ITEM: "4000"
      AI_TEXT_MIN_CHARS: "2"
      MAX_IMAGES_PER_ITEM: "4"
      # SpamFilter
      SPAM_DUP_WINDOW_SEC: "3600"
      SPAM_FLOOD_WINDOW_SEC: "60"
      SPAM_FLOOD_THRESHOLD: "10"
      # LinkFilter
      LINK_ALLOWLIST_DOMAINS: ""
      LINK_SUSPICIOUS_TLDS: zip,mov,tk,top,xyz,gq,ml,cf,click,work
      # LexiconFilter
      LEXICON_MAX_SCORE: "0.85"
      # Arret / logs
      SHUTDOWN_TIMEOUT_SEC: "30"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      # Tests
      TEST_QUEUE_PREFIX: test
    secret:
      # !!! renseigner avant deployment !!!
      REDIS_PASSWORD: ""
      AI_GATEWAY_API_KEY: ""

  # ==========================================================================
  # action — services/action_service/src/config/settings.ts (+ logger.ts)
  # ==========================================================================
  action:
    config:
      HTTP_PORT: "3001"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      DECISION_QUEUE_NAME: decisionQueue
      DECISION_WORKER_CONCURRENCY: "5"
      MONGODB_DB: ai_moderator_history
      DEFAULT_LOW: "0.25"
      DEFAULT_MEDIUM: "0.50"
      DEFAULT_HIGH: "0.75"
      DEFAULT_CRITICAL: "1.00"
      CALLBACK_TIMEOUT_MS: "5000"
      CALLBACK_MAX_ATTEMPTS: "5"
      CALLBACK_BASE_DELAY_MS: "1000"
      CALLBACK_MAX_DELAY_MS: "30000"
      LOG_LEVEL: info
      LOG_FORMAT: console
    secret:
      # !!! renseigner avant deployment !!!
      DATABASE_URL: ""
      REDIS_PASSWORD: ""
      MONGODB_URI: ""

  # ==========================================================================
  # ai_gateway — ai-gateway/app/config/settings.py
  # ==========================================================================
  ai_gateway:
    config:
      HTTP_PORT: "4000"
      MONGODB_DB: ai_gateway
      REQUEST_TIMEOUT_SEC: "30"
      RETRY_MAX: "3"
      RETRY_BASE_DELAY_MS: "500"
      RETRY_MULTIPLIER: "2"
      RETRY_MAX_DELAY_MS: "8000"
      RESPONSE_RETRY: "1"
      FALLBACK_TO_TEST_PROVIDER: "false"
      MAX_ITEMS_PER_REQUEST: "100"
      DEFAULT_ACCOUNT_ID: default
      BUDGET_DEFAULT_MONTHLY_LIMIT: "100.0"
      USAGE_RETENTION_DAYS: "90"
      SHUTDOWN_TIMEOUT_SEC: "15"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    secret:
      # !!! renseigner avant deployment !!!
      MONGODB_URI: ""
      ENCRYPTION_KEY: ""       # REQUIS — Fernet key
      GATEWAY_API_KEY: ""      # REQUIS — Bearer moderation
      ADMIN_API_KEY: ""        # REQUIS — X-Admin-Key
