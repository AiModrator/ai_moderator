apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: deployment-ingestion-{{ .Values.namespace }}
    {{- include "monapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.ingestion }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: pod-ingestion-{{ .Values.namespace }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: pod-ingestion-{{ .Values.namespace }}
        {{- include "monapp.labels" . | nindent 8 }}
    spec:
      containers:
        - name: ingestion-service
          image: "{{ .Values.services.ingestion.image.name }}:{{ .Values.services.ingestion.image.tags }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.services.ingestion.image.port }}
              name: http
          envFrom:
            - configMapRef:
                name: configmap-ingestion-{{ .Values.namespace }}
            - secretRef:
                name: secrete-ingestion-{{ .Values.namespace }}

          startupProbe:
            httpGet:
              port: {{ .Values.services.ingestion.image.port }}
              path: {{ .Values.services.ingestion.heath.startup.path }}
            failureThreshold: {{ .Values.services.ingestion.heath.startup.failureThreshold }}
            periodSeconds: {{ .Values.services.ingestion.heath.startup.periodSeconds }}

          livenessProbe:
            httpGet:
              port: {{ .Values.services.ingestion.image.port }}
              path: {{ .Values.services.ingestion.heath.startup.path }}
            failureThreshold: {{ .Values.services.ingestion.heath.startup.failureThreshold }}
            periodSeconds: {{ .Values.services.ingestion.heath.startup.periodSeconds }}

          readinessProbe:
            httpGet:
              port: {{ .Values.services.ingestion.image.port }}
              path: {{ .Values.services.ingestion.heath.readiness.path }}
            failureThreshold: {{ .Values.services.ingestion.heath.readiness.failureThreshold }}
            periodSeconds: {{ .Values.services.ingestion.heath.readiness.periodSeconds }}

          resources:
            requests:
              memory: {{ .Values.services.ingestion.ressources.requests.memory }}
              cpu: {{ .Values.services.ingestion.ressources.requests.cpu }}
            limits:
              memory: {{ .Values.services.ingestion.ressources.limits.memory }}
              cpu: {{ .Values.services.ingestion.ressources.limits.cpu }}

---

