    app.kubernetes.io/component: configmap-action-{{ .Values.namespace }}
    {{- include "monapp.labels" . | nindent 4 }}
data:
  {{- range $key, $value := dig "action" "config" (dict) $env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-ai-gateway-{{ .Values.namespace }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: configmap-ai-gateway-{{ .Values.namespace }}
    {{- include "monapp.labels" . | nindent 4 }}
data:
  {{- range $key, $value := dig "ai_gateway" "config" (dict) $env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
