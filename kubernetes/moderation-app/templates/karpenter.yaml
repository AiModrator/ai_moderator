# =====================================================================
# 1. INGESTION (EC2NodeClass + NodePool)
# =====================================================================
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ingestion-ec2-nodeclass 
  labels:
    app.kubernetes.io/component: ingestion-nodeClass-{{ .Values.namespace }}
     {{- include "monapp.labels" . | nindent 4 }}
spec:
  role: {{ .Values.karpeneter.ingestion.role }}
  amiFamily: AL2
  amiSelectorTerms:
    - ssm: "/aws/service/eks/optimized-ami/1.30/amazon-linux-2/recommended/image_id"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.karpeneter.ingestion.subnetTag }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.karpeneter.ingestion.securityGroupTag }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ingestion-nodepool
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ingestion-ec2-nodeclass # Liaison stricte ici
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ .Values.karpeneter.ingestion.capacityType | default (list "on-demand") | toJson }}
  limits:
    cpu: {{ .Values.karpeneter.ingestion.limitCpu | default "8" | quote }}
    memory: {{ .Values.karpeneter.ingestion.limitMemory | default "32Gi" | quote }}

---
