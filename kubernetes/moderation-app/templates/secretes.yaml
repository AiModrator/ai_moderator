# Secrets — un par service (cles et valeurs liees a values.env.yaml)
# charge avec : helm install ... -f values.yaml -f values.env.yaml
{{- $env := .Values.env | default dict }}

apiVersion: v1
kind: Secret
metadata:
  name: secrete-ingestion-{{ .Values.namespace }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: secrete-ingestion-{{ .Values.namespace }}
    {{- include "monapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := dig "ingestion" "secret" (dict) $env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

