services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-moderator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_moderator}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:alpine
    container_name: bullmq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  mongo:
    image: mongo:7
    container_name: ai-moderator-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - backend

  ingestion_service:
    build:
      context: .
      dockerfile: services/ingestion_service/Dockerfile
    container_name: ingestion_service
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ai_moderator}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "3000:3000"
    networks:
      - backend

  action_service:
    build:
      context: .
      dockerfile: services/action_service/Dockerfile
    container_name: action_service
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - mongo
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ai_moderator}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-ai_moderator}
      HTTP_PORT: "3001"
    ports:
      - "3001:3001"
    networks:
      - backend

  moderation_service:
    build:
      context: ./moderation_service
    container_name: moderation_service
    restart: unless-stopped
    depends_on:
      - redis
      - ai_gateway
    environment:
      # Redis / BullMQ
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      CONTENT_QUEUE_NAME: contentQueue
      DECISION_QUEUE_NAME: decisionQueue
      # Préfixe BullMQ identique à l'ingestion (défaut Node « bull »)
      TEST_QUEUE_PREFIX: bull
      # HTTP
      HTTP_PORT: "8000"
      # WorkerPool (concurrence dynamique)
      WORKER_POOL_MIN: "2"
      WORKER_POOL_INITIAL: "4"
      WORKER_POOL_MAX: "32"
      SCALE_STEP: "2"
      SCALE_COOLDOWN_SEC: "10"
      MONITOR_INTERVAL_SEC: "5"
      CPU_LOW_PCT: "65"
      CPU_HIGH_PCT: "85"
      RAM_LOW_PCT: "70"
      RAM_HIGH_PCT: "80"
      RAM_CRITICAL_PCT: "90"
      # Retry sélectif
      MAX_FILTER_RETRIES: "3"
      RETRY_BASE_DELAY_MS: "5000"
      RETRY_MAX_DELAY_MS: "300000"
      # Lot / filtres
      MAX_ITEMS_PER_BATCH: "50"
      FILTER_TIMEOUT_SEC: "10"
      FILTERS_DISABLED: ""
      # AI Gateway (phase 4/5) — Bearer token partagé avec le gateway
      AI_GATEWAY_URL: http://ai_gateway:4000
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      AI_REQUEST_TIMEOUT_SEC: "30"
      AI_MAX_PARALLEL_REQUESTS: "4"
      AI_TEXT_BATCH_SIZE: "10"
      AI_TEXT_MAX_CHARS_PER_ITEM: "4000"
      AI_TEXT_MIN_CHARS: "2"
      MAX_IMAGES_PER_ITEM: "4"
      # SpamFilter
      SPAM_DUP_WINDOW_SEC: "3600"
      SPAM_FLOOD_WINDOW_SEC: "60"
      SPAM_FLOOD_THRESHOLD: "10"
      # LinkFilter
      LINK_ALLOWLIST_DOMAINS: ""
      LINK_SUSPICIOUS_TLDS: "zip,mov,tk,top,xyz,gq,ml,cf,click,work"
      # LexiconFilter
      LEXICON_MAX_SCORE: "0.85"
      # Arrêt / logs
      SHUTDOWN_TIMEOUT_SEC: "30"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    networks:
      - backend

  ai_gateway:
    build:
      context: ./ai-gateway
    container_name: ai_gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # HTTP
      HTTP_PORT: "4000"
      # MongoDB
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ai_gateway
      # Security (requis)
      ENCRYPTION_KEY: ${AI_GATEWAY_ENCRYPTION_KEY}
      GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      ADMIN_API_KEY: ${AI_GATEWAY_ADMIN_API_KEY}
      # Providers / réseau
      REQUEST_TIMEOUT_SEC: "30"
      RETRY_MAX: "3"
      RETRY_BASE_DELAY_MS: "500"
      RETRY_MULTIPLIER: "2"
      RETRY_MAX_DELAY_MS: "8000"
      RESPONSE_RETRY: "1"
      FALLBACK_TO_TEST_PROVIDER: "false"
      MAX_ITEMS_PER_REQUEST: "100"
      BUDGET_DEFAULT_MONTHLY_LIMIT: "100.0"
      USAGE_RETENTION_DAYS: "90"
      DEFAULT_ACCOUNT_ID: "default"
      SHUTDOWN_TIMEOUT_SEC: "15"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      # AI Gateway (service dédié, phase 4/5)
      AI_GATEWAY_URL: http://ai_gateway:4000
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      AI_REQUEST_TIMEOUT_SEC: "30"
      AI_MAX_PARALLEL_REQUESTS: "4"
      AI_TEXT_BATCH_SIZE: "10"
      AI_TEXT_MAX_CHARS_PER_ITEM: "4000"
      AI_TEXT_MIN_CHARS: "2"
      MAX_IMAGES_PER_ITEM: "4"
      # Retry sélectif
      MAX_FILTER_RETRIES: "3"
    depends_on:
      - mongo
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  mongodata: